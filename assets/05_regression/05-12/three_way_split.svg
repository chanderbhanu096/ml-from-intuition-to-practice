<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300"
     font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="300" fill="#ffffff"/>
  <defs>
    <marker id="tip2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5"
            orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2c5f9e"/></marker>
    <marker id="tip3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5"
            orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f4a"/></marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="16" fill="#333333">20,640 rows, split once, before looking at anything</text>

  <rect x="40" y="50" width="480" height="34" rx="4" fill="#eef3f9" stroke="#2c5f9e" stroke-width="2"/>
  <text x="280" y="72" text-anchor="middle" font-size="13" fill="#2c5f9e">fit  -  12,384 rows  -  the model learns from these</text>
  <rect x="528" y="50" width="160" height="34" rx="4" fill="#eef7f1" stroke="#1f6f4a" stroke-width="2"/>
  <text x="608" y="72" text-anchor="middle" font-size="13" fill="#1f6f4a">watch  -  4,128</text>
  <rect x="696" y="50" width="164" height="34" rx="4" fill="#fdeeec" stroke="#c0392b" stroke-width="2"/>
  <text x="778" y="72" text-anchor="middle" font-size="13" fill="#c0392b">test  -  4,128</text>

  <path d="M 280 92 C 280 132, 608 132, 608 92" fill="none" stroke="#2c5f9e" stroke-width="2"
        marker-end="url(#tip2)"/>
  <rect x="408" y="117" width="72" height="15" fill="#ffffff"/>
  <text x="444" y="129" text-anchor="middle" font-size="12" fill="#2c5f9e">fit a model</text>
  <path d="M 608 150 C 608 196, 280 196, 280 150" fill="none" stroke="#1f6f4a" stroke-width="2"
        marker-end="url(#tip3)"/>
  <text x="444" y="208" text-anchor="middle" font-size="12" fill="#1f6f4a">score it, change something, go again</text>
  <circle r="7" fill="#2c5f9e">
    <animateMotion dur="9.0s" repeatCount="indefinite"
      path="M 280 92 C 280 132, 608 132, 608 92 L 608 150 C 608 196, 280 196, 280 150 Z"/>
  </circle>

  <g>
    <rect x="696" y="98" width="164" height="104" rx="6" fill="#ffffff" stroke="#c0392b"
          stroke-width="2" stroke-dasharray="6 4"/>
    <text x="778" y="128" text-anchor="middle" font-size="12.5" fill="#c0392b">SEALED</text>
    <text x="778" y="150" text-anchor="middle" font-size="11" fill="#c0392b">not looked at,</text>
    <text x="778" y="167" text-anchor="middle" font-size="11" fill="#c0392b">not fitted on,</text>
    <text x="778" y="184" text-anchor="middle" font-size="11" fill="#c0392b">not tuned against</text>
    <animate attributeName="opacity" values="1;1;1;0" keyTimes="0;0.78;0.86;1"
             dur="9.0s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <rect x="696" y="98" width="164" height="104" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="2"/>
    <text x="778" y="138" text-anchor="middle" font-size="13" fill="#c0392b">opened once</text>
    <text x="778" y="162" text-anchor="middle" font-size="13" fill="#c0392b">RMSE 0.4574</text>
    <text x="778" y="184" text-anchor="middle" font-size="11" fill="#c0392b">and never again</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.86;0.92;1"
             dur="9.0s" repeatCount="indefinite"/>
  </g>

  <text x="450" y="252" text-anchor="middle" font-size="12.5" fill="#333333">
    Every choice you make - which model, which depth, how many rounds - is paid for out of the green box.</text>
  <text x="450" y="276" text-anchor="middle" font-size="12.5" fill="#333333">
    The red box buys one number, at the end, and buys nothing else.</text>
</svg>

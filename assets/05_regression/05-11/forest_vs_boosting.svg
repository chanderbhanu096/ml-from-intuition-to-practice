<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260"
     font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5"
            orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f4a"/></marker>
  </defs>
  <!-- an explicit white ground: the notebook may be on a dark theme, and dark
       grey text on a transparent background disappears there -->
  <rect width="900" height="260" fill="#ffffff"/>

  <text x="225" y="34" text-anchor="middle" font-size="17" fill="#2c5f9e">A forest</text>
  <text x="225" y="56" text-anchor="middle" font-size="12" fill="#333333">all at once, then averaged</text>
  <text x="675" y="34" text-anchor="middle" font-size="17" fill="#1f6f4a">Boosting</text>
  <text x="675" y="56" text-anchor="middle" font-size="12" fill="#333333">one at a time, each fixing the last</text>
  <line x1="450" y1="20" x2="450" y2="240" stroke="#dddddd" stroke-width="1"/>

  <g transform="translate(-15,0)"><g opacity="0"><rect x="30" y="150" width="86" height="46" rx="4" fill="#fff" stroke="#2c5f9e" stroke-width="2"/><text x="73" y="178" text-anchor="middle" font-size="14" fill="#2c5f9e">tree 1</text><animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.14;0.9;1" dur="8.0s" repeatCount="indefinite"/></g><g opacity="0"><rect x="135" y="150" width="86" height="46" rx="4" fill="#fff" stroke="#2c5f9e" stroke-width="2"/><text x="178" y="178" text-anchor="middle" font-size="14" fill="#2c5f9e">tree 2</text><animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.14;0.9;1" dur="8.0s" repeatCount="indefinite"/></g><g opacity="0"><rect x="240" y="150" width="86" height="46" rx="4" fill="#fff" stroke="#2c5f9e" stroke-width="2"/><text x="283" y="178" text-anchor="middle" font-size="14" fill="#2c5f9e">tree 3</text><animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.14;0.9;1" dur="8.0s" repeatCount="indefinite"/></g><g opacity="0"><rect x="345" y="150" width="86" height="46" rx="4" fill="#fff" stroke="#2c5f9e" stroke-width="2"/><text x="388" y="178" text-anchor="middle" font-size="14" fill="#2c5f9e">tree 4</text><animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.14;0.9;1" dur="8.0s" repeatCount="indefinite"/></g></g>
  <g transform="translate(435,0)"><g opacity="0"><rect x="30" y="150" width="86" height="46" rx="4" fill="#fff" stroke="#1f6f4a" stroke-width="2"/><text x="73" y="172" text-anchor="middle" font-size="14" fill="#1f6f4a">tree 1</text><text x="73" y="188" text-anchor="middle" font-size="10" fill="#1f6f4a">the first guess</text><animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.06;0.12;0.94;1" dur="8.0s" repeatCount="indefinite"/></g><g opacity="0"><line x1="118" y1="173" x2="131" y2="173" stroke="#1f6f4a" stroke-width="2" marker-end="url(#tip)"/><animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.16;0.22;0.94;1" dur="8.0s" repeatCount="indefinite"/></g><g opacity="0"><rect x="135" y="150" width="86" height="46" rx="4" fill="#fff" stroke="#1f6f4a" stroke-width="2"/><text x="178" y="172" text-anchor="middle" font-size="14" fill="#1f6f4a">tree 2</text><text x="178" y="188" text-anchor="middle" font-size="10" fill="#1f6f4a">fixes tree 1</text><animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.25;0.31;0.94;1" dur="8.0s" repeatCount="indefinite"/></g><g opacity="0"><line x1="223" y1="173" x2="236" y2="173" stroke="#1f6f4a" stroke-width="2" marker-end="url(#tip)"/><animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.35;0.41;0.94;1" dur="8.0s" repeatCount="indefinite"/></g><g opacity="0"><rect x="240" y="150" width="86" height="46" rx="4" fill="#fff" stroke="#1f6f4a" stroke-width="2"/><text x="283" y="172" text-anchor="middle" font-size="14" fill="#1f6f4a">tree 3</text><text x="283" y="188" text-anchor="middle" font-size="10" fill="#1f6f4a">fixes tree 2</text><animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.44;0.50;0.94;1" dur="8.0s" repeatCount="indefinite"/></g><g opacity="0"><line x1="328" y1="173" x2="341" y2="173" stroke="#1f6f4a" stroke-width="2" marker-end="url(#tip)"/><animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.54;0.60;0.94;1" dur="8.0s" repeatCount="indefinite"/></g><g opacity="0"><rect x="345" y="150" width="86" height="46" rx="4" fill="#fff" stroke="#1f6f4a" stroke-width="2"/><text x="388" y="172" text-anchor="middle" font-size="14" fill="#1f6f4a">tree 4</text><text x="388" y="188" text-anchor="middle" font-size="10" fill="#1f6f4a">fixes tree 3</text><animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.63;0.69;0.94;1" dur="8.0s" repeatCount="indefinite"/></g></g>

  <text x="225" y="228" text-anchor="middle" font-size="12" fill="#2c5f9e">
    shuffle them and nothing changes</text>
  <text x="675" y="228" text-anchor="middle" font-size="12" fill="#1f6f4a">
    shuffle them and the model is meaningless</text>
</svg>

# Machine-readable course plan. CURRICULUM.md is the human version; this file is the one
# scripts and future sessions read. Keep the two in sync.
#
# status: planned | in_progress | complete   (complete == learner notebook AND solution
#         both executed from a fresh kernel with no errors)
# level:  core | applied | optional
# dataset: tiny (hand-typed table) | synthetic | sklearn | best_fit | none
#          best_fit = the chapter picks whichever real dataset shows its idea most clearly (D-14)

version: 1
updated: 2026-08-29
framework_decisions: DECISIONS.md
notebook_naming: "MM-CC_slug.ipynb"

modules:

